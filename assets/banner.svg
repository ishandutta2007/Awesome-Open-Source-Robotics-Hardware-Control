<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="light-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #1e3a5f;
      stroke-width: 0.8;
      stroke-opacity: 0.35;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 3px; opacity: 0.3; }
      50% { r: 6px; opacity: 0.9; }
      100% { r: 3px; opacity: 0.3; }
    }
    .orbit-cw {
      transform-origin: 1040px 210px;
      animation: rotate-cw 20s linear infinite;
    }
    .orbit-ccw {
      transform-origin: 1040px 210px;
      animation: rotate-ccw 14s linear infinite;
    }
    @keyframes rotate-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: dash 30s linear infinite;
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    .float-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Background Circuit Grid (Subtle) -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Background Ambient Glow Points -->
  <circle cx="200" cy="100" r="140" fill="#00f2fe" opacity="0.06" filter="url(#glow)" />
  <circle cx="1040" cy="210" r="160" fill="#7b2cbf" opacity="0.12" filter="url(#glow)" />
  <circle cx="650" cy="340" r="120" fill="#f857a6" opacity="0.05" filter="url(#glow)" />

  <!-- Dynamic Robotic Tech Rig (Right Section - Layered Safely Away from Left-Aligned Typography) -->
  <g id="robotics-hardware-rig">
    <!-- Concentric Technical Guidance Rings -->
    <circle cx="1040" cy="210" r="140" fill="none" stroke="#2a4365" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="1040" cy="210" r="110" fill="none" stroke="url(#cyber-cyan)" stroke-width="2" class="wave-line" stroke-opacity="0.7" />
    <circle cx="1040" cy="210" r="75" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />
    
    <!-- Rotating Servo / Actuator Gears -->
    <g class="orbit-cw">
      <circle cx="1040" cy="100" r="8" fill="#00f2fe" filter="url(#light-glow)" />
      <line x1="1040" y1="100" x2="1040" y2="120" stroke="#00f2fe" stroke-width="2" />
      <circle cx="1150" cy="210" r="6" fill="#f857a6" filter="url(#light-glow)" />
      <circle cx="930" cy="210" r="6" fill="#00f5d4" filter="url(#light-glow)" />
      <circle cx="1040" cy="320" r="7" fill="#3b82f6" filter="url(#light-glow)" />
    </g>

    <g class="orbit-ccw">
      <circle cx="1118" cy="132" r="6" fill="#ffd166" />
      <circle cx="962" cy="288" r="6" fill="#ffd166" />
      <circle cx="962" cy="132" r="5" fill="#a78bfa" />
      <circle cx="1118" cy="288" r="5" fill="#a78bfa" />
    </g>

    <!-- Central Robotic Core Controller Node -->
    <circle cx="1040" cy="210" r="42" fill="#0f172a" stroke="url(#cyber-cyan)" stroke-width="3" filter="url(#light-glow)" />
    <polygon points="1040,185 1062,223 1018,223" fill="none" stroke="#00f2fe" stroke-width="2" />
    <circle cx="1040" cy="210" r="9" fill="#00f5d4" class="pulse-circle" />

    <!-- Trajectory / Sensor Signals Stream -->
    <path d="M 820 210 C 900 210, 930 160, 998 210" fill="none" stroke="url(#cyber-cyan)" stroke-width="2" stroke-dasharray="5 5" class="wave-line" opacity="0.6" />
    <path d="M 850 250 C 920 250, 950 290, 1005 230" fill="none" stroke="url(#neon-purple)" stroke-width="1.5" stroke-dasharray="4 4" class="wave-line" opacity="0.5" />
  </g>

  <!-- FOREGROUND LAYER: Badges, Title, Subtitle, Highlights (Guaranteed High Contrast & Readability) -->
  
  <!-- Category Badge Pill -->
  <g transform="translate(70, 62)">
    <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#00f5d4" class="pulse-circle" />
    <text x="32" y="21" class="tag-text" fill="#38bdf8">PHYSICAL AI &amp; ROBOTICS</text>
  </g>

  <!-- Version / Status Indicator Pill -->
  <g transform="translate(335, 62)">
    <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="21" class="tag-text" fill="#cbd5e1">⚡ HARDWARE CONTROL</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(70, 155)">
    <text x="0" y="0" class="title-text" font-size="44">Awesome Open Source</text>
    <text x="0" y="54" class="title-text" font-size="44" fill="url(#cyber-cyan)" filter="url(#light-glow)">Robotics &amp; Hardware Control</text>
  </g>

  <!-- Descriptive Subtitle -->
  <g transform="translate(72, 252)">
    <text x="0" y="0" class="sub-text" font-size="17">Curated physical AI frameworks, robot operating systems (ROS 2),</text>
    <text x="0" y="26" class="sub-text" font-size="17">real-time motor controllers, fleet orchestration, and autonomous navigation.</text>
  </g>

  <!-- Floating Feature Tags (Left Bottom) -->
  <g transform="translate(72, 325)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="36" rx="8" fill="#132238" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="23" class="tag-text" fill="#38bdf8">🤖 ROS 2 &amp; RTOS</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="165" height="36" rx="8" fill="#132238" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="23" class="tag-text" fill="#4ade80">🦾 Actuators &amp; Servos</text>

    <!-- Pill 3 -->
    <rect x="325" y="0" width="155" height="36" rx="8" fill="#132238" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="23" class="tag-text" fill="#f472b6">🌐 Fleet RobOps</text>

    <!-- Pill 4 -->
    <rect x="495" y="0" width="180" height="36" rx="8" fill="#132238" stroke="#1e3a5f" stroke-width="1" />
    <text x="16" y="23" class="tag-text" fill="#fbbf24">🎯 Physical AI Models</text>
  </g>
</svg>
